services:
  - type: web
    name: seedenv
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NEXT_PUBLIC_APP_URL
        value: https://seedenv.com
      - key: NEXTAUTH_URL
        value: https://seedenv.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        value: SeedEnv Authentication <auth@seedenv.com>
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROOF_BUCKET
        value: proof-screenshots
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_TERIMUS_URL
        sync: false