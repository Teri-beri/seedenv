services:
  - type: web
    name: seedenv
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NEXT_PUBLIC_APP_URL
        value: https://seedenv.com
      - key: NEXTAUTH_URL
        value: https://seedenv.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        value: SeedEnv Authentication <auth@mail.seedenv.com>
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROOF_BUCKET
        value: proof-screenshots